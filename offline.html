<!doctype html>
<html lang="en" data-root="./">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Learn to Auth!</title>
    <meta name="description" content="You are offline." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="assets/pizza-icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Mono", monospace;
        background: #ffffff;
        color: #000000;
        padding: 2rem;
      }
      main {
        max-width: 32rem;
        border: 1px solid #cccccc;
        padding: 2rem;
        background: #f0f0f0;
      }
      h1 {
        font-family: "Press Start 2P", cursive;
        color: #ff00ff;
        font-size: 1.1rem;
        line-height: 1.5;
      }
      a {
        color: #ff00ff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111111;
          color: #ffffff;
        }
        main {
          background: #222222;
          border-color: #444444;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page is available offline, but the requested page was not cached.
        Reconnect and try again.
      </p>
      <p><a class="home-link" href="./">Go to the homepage</a></p>
    </main>
    <script>
      navigator.serviceWorker
        ?.getRegistration()
        .then((registration) => {
          if (registration) {
            document.querySelector(".home-link").href = registration.scope;
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
