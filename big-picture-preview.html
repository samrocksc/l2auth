<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Big Picture Diagram — Preview</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f0f0f0;
    --text-primary: #000000;
    --text-secondary: #333333;
    --accent-color: #ff00ff;
    --highlight: #3385cc;
    --border-color: #cccccc;
    --shadow-color: rgba(0,0,0,0.3);
    --font-primary: "Press Start 2P", cursive;
    --font-sans: "IBM Plex Mono", monospace;
  }
  [data-theme="dark"] {
    --bg-primary: #111111;
    --bg-secondary: #222222;
    --text-primary: #ffffff;
    --text-secondary: #dddddd;
    --border-color: #444444;
  }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .controls { display: flex; gap: 0.5rem; align-items: center; }
  button {
    font-family: var(--font-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 2px solid var(--accent-color);
    padding: 0.5rem 1rem;
    cursor: pointer;
    font-size: 0.75rem;
  }
  button:hover { background: var(--accent-color); color: var(--bg-primary); }
  .frame {
    width: 100%;
    max-width: 1100px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    padding: 1.5rem;
  }
  svg { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="controls">
    <button id="light">Light</button>
    <button id="dark">Dark</button>
  </div>
  <div class="frame" id="frame">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of the OIDC Authorization Code flow with PKCE: the User's Browser clicks Sign In, is authenticated by the Authorization Server, which redirects back to Your Backend to exchange the authorization code. The backend receives three tokens: an ID Token identifying the user (stays in the app), an Access Token for calling APIs (goes to your API), and a Refresh Token for getting new tokens (held securely by the backend)." style="max-width:100%;height:auto;" font-family="var(--font-sans)">
<style>
    .heading { font-family: var(--font-primary); font-size: 15px; fill: var(--text-primary); }
    .label { font-family: var(--font-sans); font-size: 15px; font-weight: 700; fill: var(--text-primary); }
    .sublabel { font-family: var(--font-sans); font-size: 12.5px; fill: var(--text-secondary); }
    .chip-title { font-family: var(--font-sans); font-size: 15px; font-weight: 700; }
    .chip-desc { font-family: var(--font-sans); font-size: 12.5px; fill: var(--text-secondary); }
    .step-num { font-family: var(--font-primary); font-size: 12px; fill: var(--bg-primary); }
    .flow-line { stroke: var(--text-secondary); stroke-width: 2.5; fill: none; }
    .box { fill: var(--bg-secondary); stroke: var(--text-primary); stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="flow-arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--text-secondary)" />
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="900" fill="var(--bg-primary)" />

  <!-- Title -->
  <text x="60" y="55" class="heading">OIDC AUTH CODE + PKCE</text>
  <text x="60" y="80" class="sublabel">the big picture, left to right</text>

  <!-- ===================== MAIN ACTOR BOXES ===================== -->

  <!-- 1. User / Browser -->
  <rect x="60" y="380" width="260" height="140" rx="4" class="box" stroke="var(--accent-color)" />
  <circle cx="98" cy="410" r="14" fill="var(--accent-color)" />
  <text x="98" y="415" text-anchor="middle" class="step-num">1</text>
  <text x="122" y="416" class="label">User / Browser</text>
  <text x="80" y="450" class="sublabel">clicks &quot;Sign In&quot;</text>
  <text x="80" y="470" class="sublabel">redirected to the</text>
  <text x="80" y="488" class="sublabel">Authorization Server</text>

  <!-- arrow 1 -> 2 -->
  <path d="M320,450 H420" class="flow-line" marker-end="url(#flow-arrowhead)" />

  <!-- 2. Authorization Server -->
  <rect x="420" y="380" width="280" height="140" rx="4" class="box" stroke="var(--highlight)" />
  <circle cx="458" cy="410" r="14" fill="var(--highlight)" />
  <text x="458" y="415" text-anchor="middle" class="step-num">2</text>
  <text x="482" y="416" class="label">Authorization Server</text>
  <text x="440" y="450" class="sublabel">authenticates the user</text>
  <text x="440" y="470" class="sublabel">(login, MFA, consent)</text>
  <text x="440" y="488" class="sublabel">issues an authorization code</text>

  <!-- arrow 2 -> 3 -->
  <path d="M700,450 H800" class="flow-line" marker-end="url(#flow-arrowhead)" />

  <!-- 3. Your Backend -->
  <rect x="800" y="380" width="260" height="140" rx="4" class="box" stroke="var(--accent-color)" />
  <circle cx="838" cy="410" r="14" fill="var(--accent-color)" />
  <text x="838" y="415" text-anchor="middle" class="step-num">3</text>
  <text x="862" y="416" class="label">Your Backend</text>
  <text x="820" y="450" class="sublabel">exchanges the code</text>
  <text x="820" y="470" class="sublabel">for tokens</text>
  <text x="820" y="488" class="sublabel">(with PKCE verifier)</text>

  <!-- ===================== TOKEN OUTCOMES ===================== -->

  <!-- connector lines from backend to each chip -->
  <path d="M1060,450 C1110,450 1110,180 1160,180" class="flow-line" marker-end="url(#flow-arrowhead)" />
  <path d="M1060,450 H1160" class="flow-line" marker-end="url(#flow-arrowhead)" />
  <path d="M1060,450 C1110,450 1110,720 1160,720" class="flow-line" marker-end="url(#flow-arrowhead)" />

  <!-- ID Token chip -->
  <g>
    <rect x="1160" y="120" width="380" height="120" rx="4" class="box" stroke="var(--accent-color)" />
    <rect x="1160" y="120" width="10" height="120" fill="var(--accent-color)" />
    <text x="1190" y="152" class="chip-title" fill="var(--accent-color)">ID TOKEN</text>
    <text x="1190" y="178" class="chip-desc">who you are</text>
    <text x="1190" y="198" class="chip-desc">stays in your app</text>
    <text x="1490" y="152" text-anchor="end" class="sublabel">→ your app</text>
  </g>

  <!-- Access Token chip -->
  <g>
    <rect x="1160" y="360" width="380" height="120" rx="4" class="box" stroke="var(--highlight)" />
    <rect x="1160" y="360" width="10" height="120" fill="var(--highlight)" />
    <text x="1190" y="392" class="chip-title" fill="var(--highlight)">ACCESS TOKEN</text>
    <text x="1190" y="418" class="chip-desc">calls APIs</text>
    <text x="1190" y="438" class="chip-desc">sent with requests to your API</text>
    <text x="1490" y="392" text-anchor="end" class="sublabel">→ your API</text>
  </g>

  <!-- Refresh Token chip -->
  <g>
    <rect x="1160" y="660" width="380" height="120" rx="4" class="box" stroke="var(--text-secondary)" />
    <rect x="1160" y="660" width="5" height="120" fill="var(--accent-color)" />
    <rect x="1165" y="660" width="5" height="120" fill="var(--highlight)" />
    <text x="1190" y="692" class="chip-title" fill="var(--text-primary)">REFRESH TOKEN</text>
    <text x="1190" y="718" class="chip-desc">gets new tokens</text>
    <text x="1190" y="738" class="chip-desc">held securely by your backend</text>
    <text x="1490" y="692" text-anchor="end" class="sublabel">→ backend only</text>
  </g>

  <!-- legend -->
  <text x="60" y="850" class="sublabel">solid boxes = actors in the flow · right-hand chips = the three tokens the backend receives, and where each one goes</text>
</svg>
  </div>
  <script>
    const html = document.documentElement;
    document.getElementById('light').onclick = () => html.setAttribute('data-theme','light');
    document.getElementById('dark').onclick  = () => html.setAttribute('data-theme','dark');
  </script>
</body>
</html>
